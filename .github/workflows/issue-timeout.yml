
name: PetSathi - 36 Hour Issue Assignment Timeout

on:
  issues:
    types: [assigned]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  check-assignment:
    runs-on: ubuntu-latest

    steps:
      - name: Check assigned issues
        uses: actions/github-script@v7
        with:
          script: |
            const HOURS = 36;
            const LABEL = "available";
            const now = Date.now();

            const { owner, repo } = context.repo;

            // Get open assigned issues
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "open",
                per_page: 100
              }
            );

            for (const issue of issues) {
              if (issue.pull_request) continue;
              if (!issue.assignees || issue.assignees.length === 0) continue;

              const assignedAt = new Date(issue.assignees[0].updated_at || issue.updated_at).getTime();

              // Use assignment event time for accurate timer
              const events = await github.paginate(
                github.rest.issues.listEvents,
                {
                  owner,
                  repo,
                  issue_number: issue.number,
                  per_page: 100
                }
              );

              const assignmentEvents = events
                .filter(e => e.event === "assigned" && e.assignee)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              if (!assignmentEvents.length) continue;

              const latestAssignment = assignmentEvents[0];
              const assignmentTime = new Date(latestAssignment.created_at).getTime();

              if (now - assignmentTime < HOURS * 60 * 60 * 1000) continue;

              // Check for an open or closed PR linked to this issue
              const prs = await github.paginate(
                github.rest.pulls.list,
                {
                  owner,
                  repo,
                  state: "all",
                  per_page: 100
                }
              );

              const linkedPR = prs.some(pr =>
                pr.body &&
                new RegExp(
                  `(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?)\\s+#${issue.number}\\b`,
                  "i"
                ).test(pr.body)
              );

              if (linkedPR) continue;

              // Remove current assignees
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                assignees: []
              });

              // Add available label
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: [LABEL]
              });

              // Notify contributors
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body:
                  "⏰ This issue has been automatically unassigned because no linked Pull Request was opened within 36 hours of assignment.\n\n" +
                  "The issue is now available for another contributor. Please follow the PetSathi contribution guidelines before requesting it. 💚🐾"
              });

              console.log(`Issue #${issue.number} has been released.`);
            }
